name: Publish OpenClaw plugin to ClawHub

# Publishes plugins/openclaw (generated by `npm run build:openclaw-plugin`) to ClawHub as the
# bundle-plugin @chatbotx/chatbotx, through ClawHub's reusable package workflow
# (docs/publishing.md "Trusted Publishing for Packages" in openclaw/clawhub).
#
# - Pull request that touches plugins/openclaw/: dry run. It resolves the publish payload (family,
#   name, version, summary, source) without uploading.
# - Manual run: dry run by default. Untick `dry_run` to publish. ClawHub rejects a version it
#   already has, so bump `version` in plugin.json and rebuild before each real publish. The version
#   comes from plugins/openclaw/package.json.
#
# The package is read from this repository at the run's commit (`source_path`), which is why
# plugins/openclaw is committed rather than built here.
#
# Setup:
# 1. First publish by hand from a machine logged in with `clawhub login`:
#      clawhub package publish plugins/openclaw --family bundle-plugin --owner chatbotx --dry-run
#      clawhub package publish plugins/openclaw --family bundle-plugin --owner chatbotx --wait
# 2. Then let this workflow publish without a stored token:
#      clawhub package trusted-publisher set @chatbotx/chatbotx \
#        --repository ChatbotXIO/chatbotx-agent --workflow-filename clawhub-plugin-publish.yml
#    Until then, the CLAWHUB_TOKEN repository secret (shared with clawhub-publish.yml) is used.
#
# Category: bundle plugins can only declare one in openclaw.plugin.json, which would make OpenClaw
# load this package as a native plugin. Leave it to ClawHub's automatic classification and fix it
# on the package settings page if needed. Topics: pass `topics` once on a manual run.

on:
  pull_request:
    paths:
      - "plugins/openclaw/**"
      - ".github/workflows/clawhub-plugin-publish.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Resolve the publish payload without uploading anything"
        type: boolean
        default: true
      topics:
        description: "Optional comma-separated catalog topics (omit to keep the stored ones)"
        type: string
        default: ""

concurrency:
  group: clawhub-plugin-publish-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Publish @chatbotx/chatbotx
    permissions:
      actions: read
      contents: read
      # Trusted publishing (OIDC) on workflow_dispatch, and the reusable workflow's own source lookup.
      id-token: write
    # Pinned to a commit, not a branch: this job can receive CLAWHUB_TOKEN. Bump deliberately.
    # 252a3f86… is openclaw/clawhub main as of 2026-11-23.
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@252a3f86d05331ea5944ad7749165fafb282097e
    with:
      source_path: plugins/openclaw
      family: bundle-plugin
      owner: chatbotx
      dry_run: ${{ github.event_name == 'pull_request' || inputs.dry_run == true }}
      topics: ${{ inputs.topics || '' }}
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
